services:
  - type: web
    name: readease
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 18.20.0
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
